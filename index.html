<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DECEASED ESTATE SERVICES – Northern Rivers</title>
  <meta name="description" content="Deceased estate clearance, cleaning and property preparation across the Northern Rivers. Professional, discreet, local.">
  <style>
    :root { --border: #000; --text: #000; --bg: #fff; }
    html, body { height: 100%; margin: 0; font-family: "Times New Roman", Times, serif; color: var(--text); background: var(--bg); line-height: 1.4; }
    .wrap { min-height: 100%; display: grid; place-items: center; padding: 24px; }
    .card { max-width: 720px; width: 100%; border: 1px solid var(--border); padding: 40px 28px; box-sizing: border-box; background: var(--bg); }
    .center { text-align: center; }
    h1, h2, p { margin: 0 0 14px 0; }
    h1 { font-size: 28px; letter-spacing: 0.5px; text-transform: uppercase; }
    h2 { font-size: 16px; text-transform: uppercase; }
    .area { font-size: 14px; text-transform: uppercase; margin-top: 6px; }
    hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
    .services { list-style: none; padding: 0; margin: 8px 0 16px; }
    .services li { text-transform: uppercase; margin: 6px 0; }
    .contact { margin-top: 12px; font-size: 14px; text-transform: uppercase; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-labelledby="title">
      <header class="center">
        <h1 id="title">Deceased Estate Services</h1>
        <h2>Professional • Discreet • Local</h2>
        <p class="area">Serving Northern Rivers</p>
      </header>
      <hr>
      <ul class="services">
        <li>Sorting, clearance, disposal</li>
        <li>Cleaning & property preparation</li>
        <li>Hourly or fixed-rate packages available</li>
      </ul>
      <hr>
      <p class="center contact">Call on 0412 345 678</p>
      <p class="center contact">ABN 12 345 678 901</p>
    </section>
  </main>
</body>
</html>
